default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        stages: [ pre-push ]
      - id: detect-private-key
        stages: [ pre-commit ]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
        args: []

  - repo: local
    hooks:
      - id: ruff-unused-imports
        name: ruff unused imports
        language: system
        stages: [ pre-commit ]
        entry: uv run --frozen ruff check --fix --select F401
        types: [ python ]
      - id: ruff-format
        name: ruff format
        language: system
        stages: [ pre-commit ]
        entry: uv run --frozen ruff format
        types: [ python ]
