name: Tests

on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run pytest -v
