[project]
name = "impact-embedding-core"
version = "0.2.0"
description = "Shared text-to-vector pipeline: tokenization, chunking, pooling and embedding-generation for keeping multiple consumers in the same vector space"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "langchain-text-splitters>=1.1.2,<2",
    "tiktoken>=0.13,<1",
    "openai>=2.30,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.3,<10",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impact_embedding_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/impact_embedding_core",
    "/tests",
    "/pyproject.toml",
]

[tool.ruff.lint]
select = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
